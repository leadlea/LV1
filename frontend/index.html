<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIスキルセルフチェック</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="favicon.ico">
</head>
<body>
  <header class="header">
    <img src="https://www.sojitz-ti.com/resources/images/common/logo_stechi.svg" alt="双日テックイノベーション" class="header-logo">
    <span class="header-title">AIスキルセルフチェック</span>
    <nav class="nav">
      <a href="index.html" class="active">ホーム</a>
      <a href="definitions.html">スキル定義</a>
      <a href="competency.html">コンピテンシーマップ</a>
    </nav>
  </header>

  <div class="container">
    <div class="hero">
      <h1>AIスキルセルフチェック</h1>
      <p>あなたのAI活用スキルを自己評価し、現在のレベルとフィードバックを確認しましょう。</p>
    </div>

    <div class="card">
      <h2>トラックを選択してください</h2>
      <p>あなたの職種に合ったトラックを選んでセルフチェックを開始します。</p>
      <div class="track-grid">
        <div class="track-card" data-track="business" role="button" tabindex="0" aria-label="ビジネスユーザートラックを選択">
          <h3>💼 ビジネスユーザー</h3>
          <p>営業・企画・管理など、AIを業務効率化に活用する方向け</p>
        </div>
        <div class="track-card" data-track="engineer" role="button" tabindex="0" aria-label="エンジニアトラックを選択">
          <h3>💻 エンジニア</h3>
          <p>開発・インフラ・データ分析など、AI技術を実装に活用する方向け</p>
        </div>
      </div>
      <div id="track-error" style="color:var(--error);margin-top:12px;display:none;">トラックを選択してください。</div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/selfcheck-app.js"></script>
  <script>
    SessionManager.init();
    let selectedTrack = null;

    document.querySelectorAll(".track-card").forEach(card => {
      card.addEventListener("click", () => {
        document.querySelectorAll(".track-card").forEach(c => c.classList.remove("selected"));
        card.classList.add("selected");
        selectedTrack = card.dataset.track;
        document.getElementById("track-error").style.display = "none";
        SessionManager.setTrack(selectedTrack);
        // 少し待ってから遷移
        setTimeout(() => {
          window.location.href = "selfcheck.html?track=" + selectedTrack;
        }, 300);
      });
      card.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); card.click(); }
      });
    });
  </script>
</body>
</html>
